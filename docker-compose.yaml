services:
  ecl:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - coolify
    labels:
      # ── Let Traefik discover this container ──────────────────────────
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"

      # ── HTTP → HTTPS redirect ────────────────────────────────────────
      - "traefik.http.routers.ecl-http.rule=Host(`eclreact.almutasim.site`)"
      - "traefik.http.routers.ecl-http.entrypoints=http"
      - "traefik.http.routers.ecl-http.middlewares=ecl-https-redirect"
      - "traefik.http.middlewares.ecl-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.ecl-https-redirect.redirectscheme.permanent=true"

      # ── HTTPS with Let's Encrypt ─────────────────────────────────────
      - "traefik.http.routers.ecl.rule=Host(`eclreact.almutasim.site`)"
      - "traefik.http.routers.ecl.entrypoints=https"
      - "traefik.http.routers.ecl.tls=true"
      - "traefik.http.routers.ecl.tls.certresolver=letsencrypt"

      # ── Backend port (nginx inside the container) ────────────────────
      - "traefik.http.services.ecl.loadbalancer.server.port=80"

networks:
  coolify:
    external: true
